<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANA: Hollow Sanctum</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="brand">
        MANA: Hollow Sanctum
        <button type="button" id="fullscreen" class="fullscreen-button" title="Fullscreen (Alt+Enter)">Fullscreen</button>
      </div>
      <div id="stats">Choose a delver</div>
      <div id="controls"></div>
    </div>

    <div id="stage">
      <div class="game-stage" id="game-stage">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="touch-controls" id="touch-controls" aria-label="Touch controls" hidden>
          <div class="touch-stick" id="touch-stick" aria-label="Move">
            <div class="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
          </div>
          <div class="touch-utilities" aria-label="Actions">
            <button type="button" data-touch-action="dash" aria-label="Dash">↗<span>Dash</span></button>
            <button type="button" data-touch-action="bomb" aria-label="Bomb">✦<span>Bomb</span></button>
            <button type="button" data-touch-action="interact" aria-label="Interact">E<span>Use</span></button>
            <button type="button" data-touch-action="ability" aria-label="Ability">★<span>Skill</span></button>
            <button type="button" data-touch-action="item" aria-label="Use item">Q<span>Item</span></button>
            <button type="button" data-touch-action="pause" aria-label="Pause">Ⅱ<span>Pause</span></button>
          </div>
          <button class="touch-attack" id="touch-attack" type="button" aria-label="Attack, auto-aim">⚔<span>Attack</span></button>
        </div>
      </div>
    </div>

    <div class="message" id="message" aria-live="polite">Choose a delver to begin the descent.</div>

    <!-- Manager scripts define shared classic-script functions before game state starts. -->
    <script src="gameui.js"></script>
    <script src="mobmanager.js"></script>
    <script src="playermanager.js"></script>
    <script src="dbmanager.js"></script>
    <script src="worldmanager.js"></script>
    <script src="game.js"></script>
  </body>
</html>
